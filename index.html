<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Pong Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            gap: 20px;
            padding: 20px;
        }

        .game-wrapper {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            width: 100%;
            justify-content: center;
        }

        .left-panel {
            color: #00ff00;
            font-size: 12px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            min-width: 150px;
        }

        .hud-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            color: #ffff00;
        }

        .hud-line {
            margin: 5px 0;
        }

        .hp-bar {
            display: inline-block;
            width: 80px;
            height: 8px;
            background: #222;
            border: 1px solid #00ff00;
            margin-left: 5px;
        }

        .hp-fill {
            height: 100%;
            background: #00ff00;
            width: 100%;
        }

        .game-container {
            position: relative;
            width: 1200px;
            height: 600px;
            background: #0a0e27;
            border: 5px solid #0099ff;
            box-shadow: 0 0 30px rgba(0, 153, 255, 0.3);
            overflow: hidden;
        }

        /* Middle ground (center divider) - 70% transparent */
        .middle-ground {
            position: absolute;
            left: 50%;
            top: 0;
            width: 8px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 0, 255, 0.3) 0px,
                rgba(255, 0, 255, 0.3) 20px,
                transparent 20px,
                transparent 40px
            );
            transform: translateX(-50%);
            z-index: 5;
            pointer-events: none;
        }

        /* Game canvas */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0e27;
        }

        /* Game over overlay */
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            z-index: 1000;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-text {
            font-size: 60px;
            font-weight: bold;
            text-align: center;
        }

        .game-over-score {
            font-size: 32px;
            text-align: center;
        }

        .restart-button {
            padding: 15px 40px;
            font-size: 20px;
            background: #00ff00;
            color: #0a0e27;
            border: 2px solid #00ff00;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .restart-button:hover {
            background: #00cc00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        /* Difficulty selector */
        .difficulty-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            z-index: 1000;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .difficulty-overlay.hidden {
            display: none;
        }

        .difficulty-title {
            font-size: 48px;
            font-weight: bold;
        }

        .difficulty-buttons {
            display: flex;
            gap: 20px;
        }

        .difficulty-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: #00ff00;
            color: #0a0e27;
            border: 2px solid #00ff00;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .difficulty-btn:hover {
            background: #00cc00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        /* Pause overlay */
        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .pause-overlay.show {
            display: flex;
        }

        .pause-text {
            font-size: 48px;
            font-weight: bold;
        }

        .right-panel {
            color: #00ff00;
            font-size: 12px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            text-align: right;
            min-width: 150px;
        }

        .top-panel {
            color: #00ff00;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            text-align: center;
            display: flex;
            gap: 80px;
            justify-content: center;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .score-label {
            font-size: 12px;
            opacity: 0.7;
        }

        .match-score {
            font-size: 24px;
            color: #00ff00;
        }

        .round-label {
            font-size: 11px;
            color: #ffff00;
        }

        .instruction-line {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="top-panel">
        <div class="score-item">
            <div class="score-label">TANK A (YOU)</div>
            <div class="match-score"><span id="scoreA">0</span> - <span id="scoreB">0</span></div>
            <div class="round-label">Match</div>
        </div>
        <div class="score-item">
            <div class="score-label">ROUND <span id="roundNumber">1</span></div>
            <div class="round-label">BEST OF 3</div>
        </div>
    </div>

    <div class="game-wrapper">
        <div class="left-panel">
            <div class="hud-title">TANK A STATUS</div>
            <div class="hud-line">HP: <span class="hp-bar"><span class="hp-fill" id="hpFillA"></span></span></div>
            <div class="hud-line">Fire Rate: <span id="fireRateA">Ready</span></div>
            <div class="hud-line">Pos: <span id="posA">0, 0</span></div>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div class="middle-ground"></div>

            <div class="difficulty-overlay" id="difficultyOverlay">
                <div class="difficulty-title">SELECT DIFFICULTY</div>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn" onclick="startGame('easy')">EASY</button>
                    <button class="difficulty-btn" onclick="startGame('medium')">MEDIUM</button>
                    <button class="difficulty-btn" onclick="startGame('hard')">HARD</button>
                </div>
            </div>

            <div class="pause-overlay" id="pauseOverlay">
                <div class="pause-text">PAUSED</div>
            </div>

            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-text" id="gameOverText">Game Over</div>
                <div class="game-over-score" id="gameOverScore">0 : 0</div>
                <button class="restart-button" onclick="location.reload()">Play Again</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="hud-title">CONTROLS</div>
            <div class="instruction-line">↑↓←→ or WASD</div>
            <div class="instruction-line">Move Tank</div>
            <div class="instruction-line"></div>
            <div class="instruction-line">Mouse</div>
            <div class="instruction-line">Aim Turret</div>
            <div class="instruction-line"></div>
            <div class="instruction-line">Left Click</div>
            <div class="instruction-line">Fire</div>
            <div class="instruction-line"></div>
            <div class="instruction-line">P</div>
            <div class="instruction-line">Pause</div>
            <div class="instruction-line"></div>
            <div class="instruction-line">SPACE</div>
            <div class="instruction-line">Next Round</div>
        </div>
    </div>

    <script>
        // Simple audio synthesis for sound effects
        function playSound(type) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'fire') {
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'hit') {
                oscillator.frequency.value = 400;
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } else if (type === 'explosion') {
                oscillator.frequency.value = 200;
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } else if (type === 'gameover') {
                oscillator.frequency.value = 300;
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 1);
            }
        }

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1200;
        canvas.height = 600;

        // Game constants
        const GAME_WIDTH = canvas.width;
        const GAME_HEIGHT = canvas.height;
        const CENTER_X = GAME_WIDTH / 2;
        const CENTER_Y = GAME_HEIGHT / 2;
        const MIDDLE_GROUND_WIDTH = 8;
        const MAX_MATCH_SCORE = 3;

        // Game state
        let gameActive = true;
        let gamePaused = false;
        let difficulty = 'medium';
        let matchScoreA = 0;
        let matchScoreB = 0;
        let roundNumber = 1;
        let roundActive = true;
        let explosionActive = false;

        // Tank A (Player) - Cyan/Light Blue
        const tankA = {
            x: 100,
            y: CENTER_Y,
            width: 40,
            height: 50,
            speed: 4,
            color: '#00ffff',
            turretAngle: 0,
            turretLength: 25,
            vx: 0,
            vy: 0,
            hp: 3,
            maxHp: 3,
            fireRate: 30,
            fireCooldown: 0
        };

        // Tank B (AI) - Yellow/Orange
        const tankB = {
            x: GAME_WIDTH - 100,
            y: CENTER_Y,
            width: 40,
            height: 50,
            speed: 3,
            color: '#ffaa00',
            turretAngle: Math.PI,
            turretLength: 25,
            vx: 0,
            vy: 0,
            hp: 3,
            maxHp: 3,
            fireRate: 40,
            fireCooldown: 0,
            targetY: CENTER_Y,
            dodgeTimer: 0,
            dodgeDirection: 1
        };

        // Projectiles
        let projectiles = [];
        let particles = [];

        // Input handling
        const keys = {};
        let mouseX = GAME_WIDTH / 2;
        let mouseY = GAME_HEIGHT / 2;

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'p') {
                e.preventDefault();
                if (gameActive && roundActive) {
                    gamePaused = !gamePaused;
                    document.getElementById('pauseOverlay').classList.toggle('show');
                }
            }
            if (e.key === ' ') {
                e.preventDefault();
                if (!roundActive && gameActive) {
                    startNewRound();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        window.addEventListener('click', () => {
            if (!gameActive || !roundActive || gamePaused) return;
            if (tankA.fireCooldown <= 0) {
                fireProjectile(tankA);
                tankA.fireCooldown = tankA.fireRate;
                playSound('fire');
            }
        });

        function startGame(selectedDifficulty) {
            difficulty = selectedDifficulty;
            
            // Adjust AI stats based on difficulty
            if (difficulty === 'easy') {
                tankB.speed = 2;
                tankB.fireRate = 60;
            } else if (difficulty === 'medium') {
                tankB.speed = 3;
                tankB.fireRate = 40;
            } else if (difficulty === 'hard') {
                tankB.speed = 4;
                tankB.fireRate = 30;
            }
            
            document.getElementById('difficultyOverlay').classList.add('hidden');
            gameActive = true;
        }

        // Draw tank
        function drawTank(tank) {
            // Tank body
            ctx.fillStyle = tank.color;
            ctx.shadowColor = tank.color;
            ctx.shadowBlur = 15;
            
            ctx.fillRect(tank.x - tank.width / 2, tank.y - tank.height / 2, tank.width, tank.height);

            // Tank treads
            ctx.fillStyle = '#333333';
            ctx.fillRect(tank.x - tank.width / 2, tank.y - tank.height / 2 - 5, tank.width, 3);
            ctx.fillRect(tank.x - tank.width / 2, tank.y + tank.height / 2 + 2, tank.width, 3);

            // HP indicator
            const hpBarWidth = tank.width;
            const hpPercent = tank.hp / tank.maxHp;
            ctx.fillStyle = hpPercent > 0.5 ? '#00ff00' : hpPercent > 0.25 ? '#ffff00' : '#ff0000';
            ctx.fillRect(tank.x - hpBarWidth / 2, tank.y - tank.height / 2 - 10, hpBarWidth * hpPercent, 3);
            ctx.strokeStyle = tank.color;
            ctx.lineWidth = 1;
            ctx.strokeRect(tank.x - hpBarWidth / 2, tank.y - tank.height / 2 - 10, hpBarWidth, 3);

            // Turret
            const turretStartX = tank.x;
            const turretStartY = tank.y;
            const turretEndX = turretStartX + Math.cos(tank.turretAngle) * tank.turretLength;
            const turretEndY = turretStartY + Math.sin(tank.turretAngle) * tank.turretLength;

            ctx.strokeStyle = tank.color;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.shadowColor = tank.color;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(turretStartX, turretStartY);
            ctx.lineTo(turretEndX, turretEndY);
            ctx.stroke();

            ctx.shadowBlur = 0;
        }

        // Fire projectile
        function fireProjectile(tank) {
            const projectile = {
                x: tank.x + Math.cos(tank.turretAngle) * tank.turretLength,
                y: tank.y + Math.sin(tank.turretAngle) * tank.turretLength,
                vx: Math.cos(tank.turretAngle) * 7,
                vy: Math.sin(tank.turretAngle) * 7,
                radius: 4,
                color: tank.color,
                owner: tank === tankA ? 'A' : 'B'
            };
            projectiles.push(projectile);
        }

        // Draw projectiles
        function drawProjectiles() {
            projectiles.forEach((proj, index) => {
                ctx.fillStyle = proj.color;
                ctx.shadowColor = proj.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                ctx.fill();

                proj.x += proj.vx;
                proj.y += proj.vy;

                if (proj.x < 0 || proj.x > GAME_WIDTH || proj.y < 0 || proj.y > GAME_HEIGHT) {
                    projectiles.splice(index, 1);
                }

                ctx.shadowBlur = 0;
            });
        }

        // Create explosion particles
        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const angle = (Math.random() * Math.PI * 2);
                const speed = Math.random() * 5 + 3;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        // Draw particles
        function drawParticles() {
            particles.forEach((p, index) => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity
                p.life -= 0.02;

                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // Collision detection
        function circleRectCollision(circle, rect) {
            const closestX = Math.max(rect.x - rect.width / 2, Math.min(circle.x, rect.x + rect.width / 2));
            const closestY = Math.max(rect.y - rect.height / 2, Math.min(circle.y, rect.y + rect.height / 2));

            const distX = circle.x - closestX;
            const distY = circle.y - closestY;
            const distSquared = distX * distX + distY * distY;

            return distSquared < circle.radius * circle.radius;
        }

        // Check collisions
        function checkCollisions() {
            projectiles.forEach((proj, projIndex) => {
                if (proj.owner === 'B' && circleRectCollision(proj, tankA)) {
                    projectiles.splice(projIndex, 1);
                    tankA.hp--;
                    playSound('hit');
                    createExplosion(tankA.x, tankA.y, '#00ffff');
                    if (tankA.hp <= 0) {
                        endRound('B');
                    }
                    return;
                }

                if (proj.owner === 'A' && circleRectCollision(proj, tankB)) {
                    projectiles.splice(projIndex, 1);
                    tankB.hp--;
                    playSound('hit');
                    createExplosion(tankB.x, tankB.y, '#ffaa00');
                    if (tankB.hp <= 0) {
                        endRound('A');
                    }
                    return;
                }
            });
        }

        // Update Tank A (Player)
        function updateTankA() {
            tankA.vx = 0;
            tankA.vy = 0;

            if (keys['arrowup'] || keys['w']) tankA.vy = -tankA.speed;
            if (keys['arrowdown'] || keys['s']) tankA.vy = tankA.speed;
            if (keys['arrowleft'] || keys['a']) tankA.vx = -tankA.speed;
            if (keys['arrowright'] || keys['d']) tankA.vx = tankA.speed;

            tankA.x += tankA.vx;
            tankA.y += tankA.vy;

            tankA.x = Math.max(tankA.width / 2, Math.min(tankA.x, CENTER_X - MIDDLE_GROUND_WIDTH / 2 - tankA.width / 2));
            tankA.y = Math.max(tankA.height / 2, Math.min(tankA.y, GAME_HEIGHT - tankA.height / 2));

            const dx = mouseX - tankA.x;
            const dy = mouseY - tankA.y;
            tankA.turretAngle = Math.atan2(dy, dx);

            tankA.fireCooldown--;
            document.getElementById('posA').textContent = `${Math.round(tankA.x)}, ${Math.round(tankA.y)}`;
            document.getElementById('fireRateA').textContent = tankA.fireCooldown > 0 ? `${tankA.fireCooldown}` : 'Ready';
            document.getElementById('hpFillA').style.width = (tankA.hp / tankA.maxHp * 100) + '%';
        }

        // Update Tank B (AI)
        function updateTankB() {
            // AI movement with better dodging
            tankB.dodgeTimer--;
            
            if (tankB.dodgeTimer <= 0) {
                // Random dodge direction change
                if (Math.random() > 0.6) {
                    tankB.dodgeDirection *= -1;
                }
                tankB.dodgeTimer = Math.random() * 40 + 20;
            }

            // Move towards target with dodging
            const distToTarget = Math.abs(tankB.targetY - tankB.y);
            if (distToTarget > 5) {
                tankB.targetY += tankB.dodgeDirection * (Math.random() * 3 + 2);
            } else {
                tankB.targetY += tankB.dodgeDirection * (Math.random() * 4);
            }
            
            tankB.targetY = Math.max(tankB.height / 2 + 30, Math.min(tankB.targetY, GAME_HEIGHT - tankB.height / 2 - 30));

            const diff = tankB.targetY - tankB.y;
            if (Math.abs(diff) > 3) {
                tankB.vy = diff > 0 ? tankB.speed : -tankB.speed;
            } else {
                tankB.vy = 0;
            }

            tankB.y += tankB.vy;
            tankB.x = Math.max(CENTER_X + MIDDLE_GROUND_WIDTH / 2 + tankB.width / 2, Math.min(tankB.x, GAME_WIDTH - tankB.width / 2));
            tankB.y = Math.max(tankB.height / 2, Math.min(tankB.y, GAME_HEIGHT - tankB.height / 2));

            // AI aiming with prediction based on difficulty
            let predictedY = tankA.y;
            if (difficulty === 'hard') {
                predictedY = tankA.y + tankA.vy * 20;
            } else if (difficulty === 'medium') {
                predictedY = tankA.y + tankA.vy * 8;
            } else {
                predictedY = tankA.y + tankA.vy * 2;
            }

            const dx = tankA.x - tankB.x;
            const dy = predictedY - tankB.y;
            tankB.turretAngle = Math.atan2(dy, dx);

            // AI shooting
            tankB.fireCooldown--;
            const fireChance = difficulty === 'hard' ? 0.92 : difficulty === 'medium' ? 0.94 : 0.96;
            if (tankB.fireCooldown <= 0 && Math.random() > fireChance) {
                fireProjectile(tankB);
                tankB.fireCooldown = tankB.fireRate;
                playSound('fire');
            }
        }

        // End round
        function endRound(winner) {
            roundActive = false;
            explosionActive = true;

            if (winner === 'A') {
                matchScoreA++;
                createExplosion(tankB.x, tankB.y, '#ff6600');
                playSound('explosion');
            } else {
                matchScoreB++;
                createExplosion(tankA.x, tankA.y, '#00ffff');
                playSound('explosion');
            }

            document.getElementById('scoreA').textContent = matchScoreA;
            document.getElementById('scoreB').textContent = matchScoreB;

            if (matchScoreA >= MAX_MATCH_SCORE) {
                setTimeout(() => endGame('Tank A WINS!'), 1000);
            } else if (matchScoreB >= MAX_MATCH_SCORE) {
                setTimeout(() => endGame('Tank B WINS!'), 1000);
            }
        }

        // Start new round
        function startNewRound() {
            if (matchScoreA >= MAX_MATCH_SCORE || matchScoreB >= MAX_MATCH_SCORE) return;

            roundNumber++;
            document.getElementById('roundNumber').textContent = roundNumber;

            tankA.x = 100;
            tankA.y = CENTER_Y;
            tankA.hp = tankA.maxHp;
            tankA.fireCooldown = 0;

            tankB.x = GAME_WIDTH - 100;
            tankB.y = CENTER_Y;
            tankB.hp = tankB.maxHp;
            tankB.fireCooldown = 0;
            tankB.targetY = CENTER_Y;
            tankB.dodgeTimer = 0;
            tankB.dodgeDirection = 1;

            projectiles = [];
            particles = [];
            explosionActive = false;
            roundActive = true;
        }

        // End game
        function endGame(message) {
            gameActive = false;
            const overlay = document.getElementById('gameOverOverlay');
            document.getElementById('gameOverText').textContent = message;
            document.getElementById('gameOverScore').textContent = `${matchScoreA} - ${matchScoreB}`;
            overlay.classList.add('show');
            playSound('gameover');
        }

        // Main game loop
        function gameLoop() {
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (gameActive && roundActive && !gamePaused) {
                updateTankA();
                updateTankB();
                checkCollisions();
            }

            if (gameActive) {
                drawTank(tankA);
                drawTank(tankB);
                drawProjectiles();
                drawParticles();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start
        gameLoop();
    </script>
</body>
</html>
